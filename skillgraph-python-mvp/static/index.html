<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillGraph MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
    header { background: #111827; color: white; padding: 28px; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
    input, textarea, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #d1d5db; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pill { display: inline-block; background: #e0ecff; padding: 8px 10px; border-radius: 999px; margin: 4px; }
    .score-bar { height: 10px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .score-fill { height: 10px; background: #2563eb; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  </style>
</head>
<body>
<header>
  <h1>SkillGraph</h1>
  <p>Turn learning into Skill Scores, Role Fit Scores, and career gaps.</p>
</header>
<main>
  <section class="card">
    <h2>Add Learning Item</h2>
    <div class="row">
      <input id="title" placeholder="Course/certification title" />
      <select id="source">
        <option value="course">Course</option>
        <option value="certification">Certification</option>
        <option value="project">Project</option>
      </select>
    </div>
    <textarea id="description" placeholder="Short description, tools, skills learned"></textarea>
    <button onclick="addItem()">Add Item</button>
    <div id="items"></div>
  </section>

  <section class="card">
    <h2>Analyze SkillGraph</h2>
    <label>Target Role</label>
    <select id="targetRole"></select>
    <button onclick="analyze()">Generate SkillGraph</button>
  </section>

  <section class="card" id="results" style="display:none;">
    <h2>Results</h2>
    <h3 id="fit"></h3>
    <h3>Skill Scores</h3>
    <div id="skills"></div>
    <h3>Role Matches</h3>
    <table id="matches"></table>
    <h3>Skill Gaps</h3>
    <div id="gaps"></div>
  </section>
</main>

<script>
let learningItems = [
  { title: "Intro to SQL", source: "course", description: "SQL queries, databases, analytics" },
  { title: "Product Strategy for Product Managers", source: "course", description: "product vision, roadmap, market analysis" },
  { title: "Introduction to Snowflake", source: "certification", description: "SQL, data warehouse, analytics" }
];

async function loadRoles() {
  const res = await fetch('/api/roles');
  const data = await res.json();
  const select = document.getElementById('targetRole');
  data.roles.forEach(role => {
    const opt = document.createElement('option');
    opt.value = role;
    opt.textContent = role;
    select.appendChild(opt);
  });
  renderItems();
}

function addItem() {
  learningItems.push({
    title: document.getElementById('title').value,
    source: document.getElementById('source').value,
    description: document.getElementById('description').value
  });
  document.getElementById('title').value = '';
  document.getElementById('description').value = '';
  renderItems();
}

function renderItems() {
  document.getElementById('items').innerHTML = learningItems.map((item, i) =>
    `<span class="pill">${item.title} (${item.source}) <button style="width:auto;padding:3px 8px;margin-left:6px" onclick="removeItem(${i})">x</button></span>`
  ).join('');
}

function removeItem(index) {
  learningItems.splice(index, 1);
  renderItems();
}

async function analyze() {
  const payload = {
    target_role: document.getElementById('targetRole').value,
    learning_items: learningItems
  };
  const res = await fetch('/api/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('results').style.display = 'block';
  document.getElementById('fit').textContent = `${data.target_role} Fit Score: ${data.role_fit_score}%`;
  document.getElementById('skills').innerHTML = Object.entries(data.skill_scores).map(([skill, score]) => `
    <p><strong>${skill}</strong>: ${score}</p>
    <div class="score-bar"><div class="score-fill" style="width:${score}%"></div></div>
  `).join('');
  document.getElementById('matches').innerHTML = '<tr><th>Role</th><th>Fit Score</th></tr>' +
    data.role_matches.map(r => `<tr><td>${r.role}</td><td>${r.fit_score}%</td></tr>`).join('');
  document.getElementById('gaps').innerHTML = data.skill_gaps.length ? data.skill_gaps.map(g =>
    `<p><strong>${g.skill}</strong> — current score: ${g.current_score}. ${g.recommended_action}</p>`
  ).join('') : '<p>No major gaps for this role.</p>';
}

loadRoles();
</script>
</body>
</html>
