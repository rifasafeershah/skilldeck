<!DOCTYPE html>
<html>
<head>
  <title>SkillDeck Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-container">

  <h1>SkillDeck</h1>
  <p>AI Career Intelligence</p>

  <form id="loginForm">

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>

<script src="js/auth.js"></script>

</body>
</html>
